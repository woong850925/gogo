<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>what</title>
<style>
  :root { box-sizing: border-box; }
  *, *::before, *::after { box-sizing: inherit; }
  html, body { margin: 0; min-height: 100%; background: #000; color: #fff; }
  body {
    font-family: "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", system-ui, sans-serif;
    padding: calc(8vw + env(safe-area-inset-top, 0px)) 8vw calc(8vw + env(safe-area-inset-bottom, 0px));
  }
  a.back {
    color: inherit; text-decoration: none; font-size: 4vw; font-weight: 700;
    letter-spacing: 0.04em; opacity: 0.6;
  }
  h1 { font-size: 7vw; font-weight: 800; margin: 8vw 0 5vw; letter-spacing: 0.02em; }
  #body {
    font-size: 4.6vw; font-weight: 700; line-height: 1.6;
    white-space: pre-wrap; word-break: keep-all;
    opacity: 0; transition: opacity 1.2s ease;
  }
  #body.show { opacity: 1; }
  @media (min-width: 900px) {
    body { padding: 60px 16vw; }
    a.back { font-size: 18px; }
    h1 { font-size: 40px; margin: 48px 0 28px; }
    #body { font-size: 22px; }
  }
</style>
</head>
<body data-key="what">
<a class="back" href="index.html">← back</a>
<h1 id="title"></h1>
<div id="body"></div>

<script src="content.js"></script>
<script>
(function () {
  var key = document.body.getAttribute('data-key');
  var page = (window.CONTENT && window.CONTENT.pages && window.CONTENT.pages[key]) || {};
  document.getElementById('title').textContent = page.title || key;
  document.title = page.title || key;
  var body = document.getElementById('body');
  body.textContent = page.text || '';
  requestAnimationFrame(function () { body.classList.add('show'); });
})();
</script>
</body>
</html>
