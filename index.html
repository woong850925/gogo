<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>...</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; color: #fff; }
  body { font-family: "Pretendard", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; }
  #stage { min-height: 100%; display: flex; flex-direction: column; align-items: center;
           justify-content: center; padding: 24px; box-sizing: border-box; text-align: center; }
  #text { white-space: pre-wrap; line-height: 1.6; font-size: clamp(20px, 4vw, 32px); min-height: 1.6em; }
  #text.big { font-size: clamp(32px, 8vw, 72px); font-weight: 700; line-height: 1.3; }
  #text.typing::after { content: "|"; margin-left: 2px; animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  #menu { display: none; gap: 20px; flex-wrap: wrap; justify-content: center; margin-top: 48px; }
  #menu a { color: #fff; text-decoration: none; font-size: clamp(20px, 4vw, 30px); padding: 10px 22px;
            border: 1px solid #fff; }
  #menu a:hover, #menu a:focus-visible { background: #fff; color: #000; outline: none; }
  #hint { position: fixed; bottom: 14px; width: 100%; text-align: center; color: #555; font-size: 13px; }
</style>
</head>
<body>
<div id="stage">
  <div id="text"></div>
  <nav id="menu"></nav>
</div>
<div id="hint">화면을 누르면 건너뛰어요</div>
<script>
var MENUS = ["when", "where", "what", "how"];
var FALLBACK = { intro: [{ big: false, text: "준비 중" }], pages: {} };
var skip = false;

function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

// 매번 다른 주소로 불러와서 캐시를 피함
function loadContent(cb) {
  var s = document.createElement("script");
  s.src = "content.js?v=" + Date.now();
  s.onload = cb;
  s.onerror = function () { window.CONTENT = FALLBACK; cb(); };
  document.head.appendChild(s);
}

async function typeText(el, text) {
  el.textContent = "";
  el.classList.add("typing");
  for (var i = 0; i < text.length; i++) {
    if (skip) { el.textContent = text; break; }
    el.textContent += text[i];
    await sleep(text[i] === "\n" ? 350 : 70);
  }
  el.classList.remove("typing");
}

async function run() {
  var c = window.CONTENT || FALLBACK;
  var el = document.getElementById("text");
  var scenes = c.intro || [];
  for (var i = 0; i < scenes.length && !skip; i++) {
    el.className = scenes[i].big ? "big" : "";
    await typeText(el, scenes[i].text || "");
    if (!skip) await sleep(1800);
  }
  el.textContent = "";
  el.className = "";
  document.getElementById("hint").style.display = "none";
  var menu = document.getElementById("menu");
  MENUS.forEach(function (k) {
    var a = document.createElement("a");
    a.href = k + ".html";
    a.textContent = (c.pages && c.pages[k] && c.pages[k].title) || k;
    menu.appendChild(a);
  });
  menu.style.display = "flex";
}

document.addEventListener("click", function () { skip = true; });
document.addEventListener("keydown", function () { skip = true; });
loadContent(run);
</script>
</body>
</html>
