<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>how</title>
<style>
  html, body { margin: 0; min-height: 100%; background: #000; color: #fff; }
  body { font-family: "Pretendard", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 56px 24px 80px; box-sizing: border-box; }
  h1 { font-size: clamp(28px, 6vw, 48px); margin: 0 0 28px; }
  #text { white-space: pre-wrap; line-height: 1.8; font-size: clamp(17px, 3.2vw, 24px); }
  #text.typing::after { content: "|"; margin-left: 2px; animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  a.back { position: fixed; top: 14px; left: 16px; color: #888; text-decoration: none; font-size: 15px; }
  a.back:hover, a.back:focus-visible { color: #fff; outline: none; }
</style>
</head>
<body data-page="how">
<a class="back" href="index.html">처음으로</a>
<main>
  <h1 id="title"></h1>
  <div id="text"></div>
</main>
<script>
var PAGE = document.body.getAttribute("data-page");
var IDLE_MS = 5000;     // 아무 조작이 없으면 5초 뒤 첫 페이지로
var timer = null;
var typingDone = false;

function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

function loadContent(cb) {
  var s = document.createElement("script");
  s.src = "content.js?v=" + Date.now();
  s.onload = cb;
  s.onerror = function () { window.CONTENT = { intro: [], pages: {} }; cb(); };
  document.head.appendChild(s);
}

function resetIdle() {
  if (!typingDone) return;
  clearTimeout(timer);
  timer = setTimeout(function () { location.href = "index.html"; }, IDLE_MS);
}

async function run() {
  var page = ((window.CONTENT || {}).pages || {})[PAGE] || { title: PAGE, text: "" };
  document.getElementById("title").textContent = page.title || PAGE;
  document.title = page.title || PAGE;
  var el = document.getElementById("text");
  var text = page.text || "";
  el.classList.add("typing");
  for (var i = 0; i < text.length; i++) {
    el.textContent += text[i];
    await sleep(text[i] === "\n" ? 300 : 55);
  }
  el.classList.remove("typing");
  typingDone = true;
  resetIdle();
}

["mousemove", "mousedown", "keydown", "touchstart", "scroll", "wheel"].forEach(function (ev) {
  window.addEventListener(ev, resetIdle, { passive: true });
});
loadContent(run);
</script>
</body>
</html>
